<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!--
      viewport-fit=cover: app fills behind the status bar and home indicator,
      enabling env(safe-area-inset-*) and the black-translucent status bar below.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1.00001, shrink-to-fit=no, viewport-fit=cover"
    />
    <!-- iOS PWA: transparent status bar so the app's dark background shows through -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finance" />
    <title>%WEB_TITLE%</title>
    <!-- react-native-web style reset + dark background to eliminate white flash -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #0f0f0f;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        background-color: #0f0f0f;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
